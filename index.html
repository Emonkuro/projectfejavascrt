<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Food Gallery</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    #image {
      width: 100%;
      max-width: 800px;
      height: 400px;
      border: 5px solid #d9534f;
      border-radius: 8px;
      margin: 0 auto 25px auto;
      background-color: #222;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      color: #FFFFFF;
      text-align: center;
      line-height: 400px;
      font-size: 160%;
      font-weight: bold;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .preview {
      width: 120px;
      height: 120px;
      border: 3px solid #ddd;
      object-fit: cover;
      cursor: pointer;
      border-radius: 8px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .preview:hover {
      transform: scale(1.05);
      border-color: #d9534f;
    }
    /* Hiệu ứng viền khi dùng phím Tab (Accessibility) */
    .preview:focus {
      outline: 4px solid #d9534f;
      border-color: #fff;
      transform: scale(1.05);
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body onload="initializeGallery()">

  <header>
    <h1>Delicious World Foods</h1>
    <p>Hover over or use the Tab key to preview mouth-watering dishes!</p>
  </header>

  <main>
    <div id="image">
      Hover or focus on a dish below to view!
    </div>

    <div class="gallery">
      <img class="preview" 
           alt="Italian Pepperoni Pizza with melted cheese" 
           src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="Juicy Bacon Cheeseburger with crispy fries" 
           src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="Japanese Assorted Sushi and Sashimi Platter" 
           src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=600" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="Traditional Vietnamese Pho Noodles with beef" 
           src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=600" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="Creamy Matcha Green Tea Ice Cream Dessert" 
           src="https://images.unsplash.com/photo-1505394033641-40c6ad1178d7?w=600" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="Fresh Berry Pancakes with syrup" 
           src="https://images.unsplash.com/photo-1528207776546-365bb710ee93?w=600" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">
    </div>
  </main>

</body>
</html>
