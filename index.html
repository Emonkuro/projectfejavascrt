<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Interactive Photo Gallery</title>
  <style>
    body {
      margin: 20px;
      font-family: sans-serif;
      background-color: #f4f4f4;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    #image {
      width: 100%;
      max-width: 800px;
      height: 400px;
      border: 5px solid #333;
      margin: 0 auto 25px auto;
      background-color: #8e8e8e;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      color: #FFFFFF;
      text-align: center;
      line-height: 400px;
      font-size: 150%;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .preview {
      width: 120px;
      height: 120px;
      border: 4px solid #333;
      object-fit: cover;
      cursor: pointer;
      border-radius: 6px;
    }
    /* Hiệu ứng viền khi dùng phím Tab (Accessibility) */
    .preview:focus {
      outline: 4px solid #005fcc;
      border-color: #fff;
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body onload="initializeGallery()">

  <header>
    <h1>Interactive Photo Gallery</h1>
    <p>Use your mouse or keyboard Tab key to navigate through the gallery.</p>
  </header>

  <main>
    <div id="image">
      Hover over an image below to display here.
    </div>

    <div class="gallery">
      <img class="preview" 
           alt="Waterfalls and blue lakes" 
           src="https://images6.alphacoders.com/108/thumb-1920-1088617.jpg" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="River flowing through green mountains" 
           src="https://i.pinimg.com/originals/cc/01/9a/cc019ac42d80034d2973435283559463.jpg" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="Lake and two mountains without trees" 
           src="https://i.pinimg.com/originals/33/0d/6a/330d6a77a01177d41773b999d98be7f4.jpg" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="River with boats flowing through plains and mountains" 
           src="https://khoinguonsangtao.vn/wp-content/uploads/2022/08/anh-thien-nhien-viet-nam-canh-dong-lua.jpg" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="Wide lake in the evening scenery" 
           src="https://tse3.mm.bing.net/th/id/OIP.Uj3TLi_4fr-HEt06aDvdawHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">

      <img class="preview" 
           alt="Blue lake with boats and limestone islands" 
           src="https://haycafe.vn/wp-content/uploads/2022/03/Canh-dep-thien-nhien-Viet-Nam.jpg" 
           onmouseover="upDate(this)" 
           onmouseleave="unDo()"
           onfocus="upDate(this)" 
           onblur="unDo()">
    </div>
  </main>

</body>
</html>
